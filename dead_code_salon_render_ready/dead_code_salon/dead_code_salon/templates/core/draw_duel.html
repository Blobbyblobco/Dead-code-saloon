<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Draw Duel — Dead Code Saloon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --brown:  #6b4226;
            --dark:   #1a0e05;
            --sand:   #c8a87c;
            --gold:   #f1c40f;
            --red:    #e74c3c;
            --green:  #2ecc71;
            --muted:  #a0845c;
        }

        body {
            background: radial-gradient(ellipse at top, #1a0a00, #0d0500);
            font-family: 'Courier New', monospace;
            color: #f0d9a0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 1.6rem;
            color: var(--gold);
            letter-spacing: 6px;
            text-shadow: 2px 2px 0 var(--brown);
        }
        .header p { color: var(--muted); font-size: 0.75rem; letter-spacing: 3px; }

        /* ── HUD ── */
        .hud {
            width: 700px;
            max-width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--brown);
            border-bottom: none;
            padding: 8px 20px;
        }
        .score-box { text-align: center; }
        .score-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 2px; }
        .score-val   { font-size: 1.6rem; color: var(--gold); line-height: 1.2; }

        /* ── Signal bar ── */
        .signal-bar {
            width: 700px;
            max-width: 100%;
            text-align: center;
            padding: 14px 10px;
            font-size: 1.1rem;
            letter-spacing: 4px;
            min-height: 58px;
            background: rgba(0,0,0,0.5);
            border-left: 2px solid var(--brown);
            border-right: 2px solid var(--brown);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signal-bar.draw-flash {
            color: var(--gold) !important;
            font-size: 2.6rem !important;
            letter-spacing: 10px !important;
            animation: flash 0.25s infinite;
        }
        .signal-bar.result-win  { color: var(--green); }
        .signal-bar.result-lose { color: var(--red); }
        .signal-bar.result-early{ color: var(--red); }

        @keyframes flash {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.2; }
        }

        /* ── Desert scene ── */
        .scene {
            width: 700px;
            max-width: 100%;
            height: 300px;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            border: 2px solid var(--brown);
            border-top: none;
            border-bottom: none;
        }

        /* sky + ground */
        .sky {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom,
                #7b3f00 0%,
                #c0642a 30%,
                #e8862a 55%,
                #c89060 70%,
                #a06840 85%,
                #7a4820 100%
            );
        }

        /* Mesa silhouette */
        .mesa {
            position: absolute;
            bottom: 70px;
        }
        .mesa-shape {
            background: #3d1a00;
            border-radius: 4px 4px 0 0;
        }

        /* Ground strip */
        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background: linear-gradient(to bottom, #a06840, #7a4820);
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 52px;
            background: radial-gradient(circle, #fff8e0, #ffcc00, #ff8800);
            border-radius: 50%;
            box-shadow: 0 0 40px #ff880088, 0 0 80px #ff440044;
        }

        /* Cactus */
        .cactus {
            position: absolute;
            bottom: 68px;
        }
        .c-trunk { width: 16px; background: #2d6a4f; border-radius: 4px; margin: 0 auto; }
        .c-arm-l, .c-arm-r {
            position: absolute;
            height: 12px;
            background: #2d6a4f;
            border-radius: 4px;
        }
        .c-arm-l { width: 18px; left: -14px; border-radius: 4px 4px 0 4px; }
        .c-arm-r { width: 18px; right: -14px; border-radius: 4px 4px 4px 0; }
        .c-tip-l, .c-tip-r {
            position: absolute;
            width: 8px;
            background: #2d6a4f;
            border-radius: 4px;
            bottom: 0;
        }
        .c-tip-l { left: -14px; }
        .c-tip-r { right: -14px; }

        /* ── Cowboys ── */
        .cowboy {
            position: absolute;
            bottom: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s ease;
        }
        .cowboy.player { left: 60px; }
        .cowboy.ai     { right: 60px; transform: scaleX(-1); }

        /* hat */
        .hat-brim {
            width: 64px; height: 7px;
            background: var(--brown);
            border-radius: 3px;
        }
        .hat-crown {
            width: 40px; height: 38px;
            background: var(--brown);
            margin: -2px auto 0;
            border-radius: 4px 4px 0 0;
            position: relative;
        }
        .hat-band {
            position: absolute;
            bottom: 6px; left: 0; right: 0;
            height: 5px;
            background: #3d1a00;
        }

        /* head */
        .head {
            width: 36px; height: 40px;
            background: #d4956a;
            border-radius: 50% 50% 42% 42%;
            margin: 1px auto 0;
            position: relative;
        }
        .eye {
            position: absolute;
            top: 13px;
            width: 5px; height: 5px;
            background: #2c1a0a;
            border-radius: 50%;
        }
        .eye.l { left: 6px; }
        .eye.r { right: 6px; }
        .mouth {
            position: absolute;
            bottom: 8px; left: 50%;
            transform: translateX(-50%);
            width: 14px; height: 3px;
            background: #9a5a30;
            border-radius: 2px;
        }
        .mustache {
            position: absolute;
            bottom: 11px; left: 50%;
            transform: translateX(-50%);
            width: 18px; height: 4px;
            background: #5a3010;
            border-radius: 3px;
        }

        /* neckerchief */
        .neckerchief {
            width: 30px; height: 8px;
            background: #c0392b;
            border-radius: 0 0 8px 8px;
            margin: -1px auto 0;
        }

        /* body */
        .body {
            width: 48px; height: 66px;
            background: var(--brown);
            border-radius: 5px 5px 0 0;
            margin-top: -1px;
            position: relative;
        }
        .vest {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 20px; height: 100%;
            background: #3d1a00;
            border-radius: 0 0 4px 4px;
        }
        .badge {
            position: absolute;
            top: 10px; right: 8px;
            width: 8px; height: 8px;
            background: #f1c40f;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        /* gun arm — points to the right of the cowboy */
        .gun-arm {
            position: absolute;
            top: 22px;
            right: -32px;
            width: 32px; height: 10px;
            background: var(--brown);
            border-radius: 3px;
            transform-origin: left center;
            transition: transform 0.15s ease;
        }
        .gun-arm.raised { transform: rotate(-25deg) translateY(-4px); }

        .gun-barrel {
            position: absolute;
            right: -18px; top: 1px;
            width: 18px; height: 8px;
            background: #1a1a1a;
            border-radius: 0 2px 2px 0;
        }

        /* muzzle flash */
        .muzzle {
            position: absolute;
            right: -44px; top: -8px;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: radial-gradient(#fff, #ffee00, #ff6600, transparent 70%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.04s;
        }
        .muzzle.fired { opacity: 1; }

        /* legs */
        .legs { display: flex; gap: 5px; margin-top: 0; }
        .leg {
            width: 21px; height: 40px;
            background: #4a2a10;
            border-radius: 0 0 4px 4px;
        }
        .boot {
            width: 25px; height: 10px;
            background: #1a0a00;
            border-radius: 0 4px 4px 2px;
            margin-top: -2px;
        }

        /* death animation */
        @keyframes cowboy-die {
            0%   { transform: rotate(0deg) translateY(0); opacity: 1; }
            100% { transform: rotate(90deg) translateY(30px); opacity: 0.3; }
        }
        .cowboy.dead        { animation: cowboy-die 0.5s ease-in forwards; }
        .cowboy.ai.dead     { animation: cowboy-die-ai 0.5s ease-in forwards; }

        @keyframes cowboy-die-ai {
            0%   { transform: scaleX(-1) rotate(0deg) translateY(0); opacity: 1; }
            100% { transform: scaleX(-1) rotate(-90deg) translateY(30px); opacity: 0.3; }
        }

        /* ── Result bar ── */
        .result-bar {
            width: 700px;
            max-width: 100%;
            text-align: center;
            min-height: 34px;
            padding: 6px 20px;
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 2px;
            background: rgba(0,0,0,0.5);
            border-left: 2px solid var(--brown);
            border-right: 2px solid var(--brown);
        }

        /* ── Controls ── */
        .controls {
            width: 700px;
            max-width: 100%;
            text-align: center;
            padding: 14px;
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--brown);
            border-top: none;
        }

        .btn {
            padding: 12px 44px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            background: #6b4226;
            color: #f0d9a0;
            border: 2px solid #a06840;
            cursor: pointer;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.1s;
        }
        .btn:hover { background: #8b5a36; border-color: var(--gold); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: default; transform: none; }

        .key-hint {
            margin-top: 8px;
            font-size: 0.7rem;
            color: #5a3a1a;
            letter-spacing: 2px;
        }

        /* ── Reaction time bar ── */
        .reaction-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-top: 6px;
        }
        .reaction-label { font-size: 0.7rem; color: var(--muted); width: 80px; text-align: right; }
        .reaction-track {
            width: 220px; height: 14px;
            background: #1a0e05;
            border: 1px solid #3d1a00;
            border-radius: 3px;
            overflow: hidden;
        }
        .reaction-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .reaction-fill.player-fill { background: linear-gradient(to right, #2ecc71, #27ae60); }
        .reaction-fill.ai-fill     { background: linear-gradient(to right, #e74c3c, #c0392b); }
        .reaction-time { font-size: 0.75rem; color: var(--sand); width: 60px; }

        .back-link {
            margin-top: 14px;
            font-size: 0.75rem;
            color: #5a3a1a;
            letter-spacing: 2px;
        }
        .back-link a { color: var(--muted); text-decoration: none; }
        .back-link a:hover { color: var(--gold); }
    </style>
</head>
<body>

<div class="header">
    <h1>DEAD CODE SALOON</h1>
    <p>QUICK DRAW DUEL</p>
</div>

<!-- HUD -->
<div class="hud">
    <div class="score-box">
        <div class="score-label">YOUR WINS</div>
        <div class="score-val" id="playerWins">0</div>
    </div>
    <div class="score-box">
        <div class="score-label">ROUND</div>
        <div class="score-val" id="roundNum">1 / 5</div>
    </div>
    <div class="score-box">
        <div class="score-label">OUTLAW WINS</div>
        <div class="score-val" id="aiWins">0</div>
    </div>
</div>

<!-- Signal -->
<div class="signal-bar" id="signal">Press START — or hit SPACE</div>

<!-- Scene (click to shoot) -->
<div class="scene" id="scene" onclick="onSceneClick()">
    <div class="sky"></div>

    <!-- Mesas -->
    <div class="mesa" style="left:260px">
        <div class="mesa-shape" style="width:180px;height:70px;"></div>
    </div>
    <div class="mesa" style="right:80px; bottom:90px">
        <div class="mesa-shape" style="width:90px;height:45px;"></div>
    </div>

    <div class="ground"></div>
    <div class="sun"></div>

    <!-- Cactus L -->
    <div class="cactus" style="left:190px">
        <div class="c-trunk" style="height:72px;position:relative;">
            <div class="c-arm-l" style="top:20px;">
                <div class="c-tip-l" style="height:16px;"></div>
            </div>
            <div class="c-arm-r" style="top:34px;">
                <div class="c-tip-r" style="height:12px;"></div>
            </div>
        </div>
    </div>

    <!-- Cactus R -->
    <div class="cactus" style="right:195px">
        <div class="c-trunk" style="height:54px;position:relative;">
            <div class="c-arm-l" style="top:18px;">
                <div class="c-tip-l" style="height:12px;"></div>
            </div>
        </div>
    </div>

    <!-- Player cowboy (left, faces right) -->
    <div class="cowboy player" id="playerCowboy">
        <div class="hat-brim"></div>
        <div class="hat-crown"><div class="hat-band"></div></div>
        <div class="head">
            <div class="eye l"></div>
            <div class="eye r"></div>
            <div class="mustache"></div>
            <div class="mouth"></div>
        </div>
        <div class="neckerchief" style="background:#2980b9"></div>
        <div class="body">
            <div class="vest"></div>
            <div class="badge"></div>
            <div class="gun-arm" id="playerArm">
                <div class="gun-barrel"></div>
                <div class="muzzle" id="playerMuzzle"></div>
            </div>
        </div>
        <div class="legs">
            <div style="display:flex;flex-direction:column;align-items:center">
                <div class="leg"></div>
                <div class="boot"></div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center">
                <div class="leg"></div>
                <div class="boot"></div>
            </div>
        </div>
    </div>

    <!-- AI cowboy (right, mirrored to face left) -->
    <div class="cowboy ai" id="aiCowboy">
        <div class="hat-brim" style="background:#1a0e05"></div>
        <div class="hat-crown" style="background:#1a0e05"><div class="hat-band" style="background:#3d0000"></div></div>
        <div class="head" style="background:#c07050">
            <div class="eye l"></div>
            <div class="eye r"></div>
            <div class="mustache" style="background:#1a0e05"></div>
            <div class="mouth" style="background:#7a3010"></div>
        </div>
        <div class="neckerchief" style="background:#8b0000"></div>
        <div class="body" style="background:#1a0e05">
            <div class="vest" style="background:#2d0000"></div>
            <div class="gun-arm" id="aiArm" style="background:#1a0e05">
                <div class="gun-barrel"></div>
                <div class="muzzle" id="aiMuzzle"></div>
            </div>
        </div>
        <div class="legs">
            <div style="display:flex;flex-direction:column;align-items:center">
                <div class="leg" style="background:#111"></div>
                <div class="boot" style="background:#0a0a0a"></div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center">
                <div class="leg" style="background:#111"></div>
                <div class="boot" style="background:#0a0a0a"></div>
            </div>
        </div>
    </div>
</div>

<!-- Result detail + reaction bars -->
<div class="result-bar" id="resultBar">
    <div id="reactionRows" style="display:none">
        <div class="reaction-row">
            <span class="reaction-label">YOU</span>
            <div class="reaction-track">
                <div class="reaction-fill player-fill" id="playerBar" style="width:0%"></div>
            </div>
            <span class="reaction-time" id="playerTime"></span>
        </div>
        <div class="reaction-row" style="margin-top:4px">
            <span class="reaction-label">OUTLAW</span>
            <div class="reaction-track">
                <div class="reaction-fill ai-fill" id="aiBar" style="width:0%"></div>
            </div>
            <span class="reaction-time" id="aiTime"></span>
        </div>
    </div>
    <span id="resultMsg"></span>
</div>

<!-- Controls -->
<div class="controls">
    <button class="btn" id="startBtn" onclick="startRound()">START DUEL</button>
    <p class="key-hint">SPACE or click the scene to shoot</p>
</div>

<div class="back-link"><a href="/">&larr; Back to Saloon</a></div>

<script>
// ── Game state ─────────────────────────────────────
const S = { IDLE: 0, WAITING: 1, DRAW: 2, RESULT: 3 };
let state = S.IDLE;
let drawTimeout = null;
let aiTimeout   = null;
let drawTime    = 0;
let aiReactionMs = 0;
let pWins = 0, aWins = 0, round = 1;
const MAX_ROUNDS = 5;

// ── Audio ───────────────────────────────────────────
let audioCtx = null;
function audio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function playGunshot() {
    const ctx = audio();
    const dur = 0.18;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d   = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    }
    const src  = ctx.createBufferSource();
    const gain = ctx.createGain();
    const bpf  = ctx.createBiquadFilter();
    src.buffer = buf;
    bpf.type = 'bandpass';
    bpf.frequency.value = 280;
    bpf.Q.value = 0.8;
    gain.gain.setValueAtTime(1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    src.connect(bpf); bpf.connect(gain); gain.connect(ctx.destination);
    src.start();
}

function playDrawChime() {
    const ctx = audio();
    [440, 660, 880].forEach((freq, i) => {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const t = ctx.currentTime + i * 0.06;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.25);
    });
}

// ── Helpers ─────────────────────────────────────────
function setSignal(txt, cls) {
    const el = document.getElementById('signal');
    el.textContent = txt;
    el.className = 'signal-bar' + (cls ? ' ' + cls : '');
}

function flash(id) {
    const el = document.getElementById(id);
    el.classList.add('fired');
    setTimeout(() => el.classList.remove('fired'), 90);
}

function raiseArm(id) {
    document.getElementById(id).classList.add('raised');
}
function lowerArm(id) {
    document.getElementById(id).classList.remove('raised');
}

function dieCowboy(id) {
    document.getElementById(id).classList.add('dead');
}

function resetCowboys() {
    ['playerCowboy','aiCowboy'].forEach(id => {
        document.getElementById(id).classList.remove('dead');
    });
    lowerArm('playerArm');
    lowerArm('aiArm');
}

function showReactionBars(pMs, aMs) {
    const maxMs = 800;
    const pPct  = Math.min(100, (pMs / maxMs) * 100);
    const aPct  = Math.min(100, (aMs / maxMs) * 100);

    document.getElementById('playerBar').style.width = pPct + '%';
    document.getElementById('aiBar').style.width     = aPct + '%';
    document.getElementById('playerTime').textContent = pMs + 'ms';
    document.getElementById('aiTime').textContent     = aMs + 'ms';
    document.getElementById('reactionRows').style.display = 'block';
    document.getElementById('resultMsg').textContent = '';
}

function hideReactionBars() {
    document.getElementById('reactionRows').style.display = 'none';
    document.getElementById('resultMsg').textContent = '';
    document.getElementById('playerBar').style.width = '0%';
    document.getElementById('aiBar').style.width     = '0%';
}

function updateHUD() {
    document.getElementById('playerWins').textContent = pWins;
    document.getElementById('aiWins').textContent     = aWins;
    document.getElementById('roundNum').textContent   = round + ' / ' + MAX_ROUNDS;
}

// ── Game flow ────────────────────────────────────────
function startRound() {
    if (state !== S.IDLE) return;
    state = S.WAITING;

    resetCowboys();
    hideReactionBars();
    document.getElementById('startBtn').disabled = true;
    setSignal('Keep your hand near your iron...', '');

    let dots = 0;
    const ticker = setInterval(() => {
        dots = (dots % 3) + 1;
        setSignal('Keep your hand near your iron' + '.'.repeat(dots), '');
    }, 350);

    const wait = 1800 + Math.random() * 3200;
    drawTimeout = setTimeout(() => {
        clearInterval(ticker);
        triggerDraw();
    }, wait);
}

function triggerDraw() {
    state    = S.DRAW;
    drawTime = performance.now();
    setSignal('DRAW!', 'draw-flash');
    playDrawChime();
    raiseArm('playerArm');
    raiseArm('aiArm');

    aiReactionMs = Math.round(220 + Math.random() * 280); // 220–500 ms
    aiTimeout = setTimeout(() => {
        if (state === S.DRAW) resolveRound('ai');
    }, aiReactionMs);
}

function onSceneClick() {
    if (state === S.WAITING) {
        clearTimeout(drawTimeout);
        state = S.RESULT;
        playGunshot();
        flash('playerMuzzle');
        aWins++;
        updateHUD();
        setSignal('TOO EARLY — you drew first. Cheater.', 'result-early');
        document.getElementById('resultMsg').textContent =
            "Drawing before DRAW! is against the code of the West.";
        endRound();
        return;
    }
    if (state === S.DRAW) {
        const pMs = Math.round(performance.now() - drawTime);
        clearTimeout(aiTimeout);
        resolveRound('player', pMs);
    }
}

function resolveRound(winner, pMs) {
    state = S.RESULT;

    if (winner === 'player') {
        const displayAi = Math.round(pMs + 30 + Math.random() * 140);
        playGunshot();
        flash('playerMuzzle');
        dieCowboy('aiCowboy');
        setSignal('YOU WIN! Slick shooting, partner.', 'result-win');
        showReactionBars(pMs, displayAi);
        pWins++;
    } else {
        playGunshot();
        flash('aiMuzzle');
        dieCowboy('playerCowboy');
        setSignal("TOO SLOW — the outlaw got you.", 'result-lose');
        showReactionBars(999, aiReactionMs); // player didn't click in time
        document.getElementById('playerTime').textContent = 'too slow';
        aWins++;
    }

    updateHUD();
    endRound();
}

function endRound() {
    setTimeout(() => {
        state = S.IDLE;
        round++;

        if (round > MAX_ROUNDS) {
            // Game over
            if (pWins > aWins) {
                setSignal('LEGENDARY — you\'re the fastest gun in the West!', 'result-win');
            } else if (aWins > pWins) {
                setSignal('Outgunned. The outlaw rides free.', 'result-lose');
            } else {
                setSignal('A perfect tie. The West remains wild.', '');
            }
            document.getElementById('startBtn').textContent = 'PLAY AGAIN';
            pWins = 0; aWins = 0; round = 1;
            updateHUD();
        } else {
            updateHUD();
        }

        document.getElementById('startBtn').disabled = false;
    }, 2200);
}

// ── Keyboard ─────────────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        if (state === S.IDLE) {
            startRound();
        } else {
            onSceneClick();
        }
    }
});
</script>

</body>
</html>
