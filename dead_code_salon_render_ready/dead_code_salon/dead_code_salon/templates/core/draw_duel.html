<!DOCTYPE html>
<html>
<head>
    <title>Draw Duel</title>
    <style>
        #target { width: 600px; height: 400px; background: #333; position: relative; cursor: crosshair; }
        .shot { width: 10px; height: 10px; background: red; position: absolute; border-radius: 50%; }
    </style>
    <script>
        let ready = false;
        window.onload = function() {
            setTimeout(() => {
                document.getElementById("msg").textContent = "DRAW!";
                ready = true;
            }, 3000);
        }

        function shoot(event) {
            if (!ready) {
                alert("Too early! You're dead.");
                return;
            }

            const box = event.currentTarget;
            const x = event.offsetX;
            const y = event.offsetY;

            const shot = document.createElement("div");
            shot.className = "shot";
            shot.style.left = (x - 5) + "px";
            shot.style.top = (y - 5) + "px";
            box.appendChild(shot);

            document.getElementById("msg").textContent = `You shot at (${x}, ${y})`;
        }
    </script>
</head>
<body>
    <h1>Fast Draw Duel</h1>
    <p id="msg">Get Ready...</p>
    <div id="target" onclick="shoot(event)"></div>
</body>
</html>
