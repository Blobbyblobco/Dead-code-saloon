<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight Betting — Dead Code Saloon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(ellipse at top, #1a0a00, #0d0500);
            font-family: 'Courier New', monospace;
            color: #f0d9a0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 60px;
        }

        .header { text-align: center; margin-bottom: 28px; }
        .header h1 {
            font-size: 1.6rem;
            color: #f1c40f;
            letter-spacing: 6px;
            text-shadow: 2px 2px 0 #6b4226;
        }
        .header p { color: #a0845c; font-size: 0.75rem; letter-spacing: 3px; margin-top: 4px; }

        .card {
            width: 660px;
            max-width: 100%;
            border: 2px solid #6b4226;
            background: linear-gradient(to bottom, #2d1a0a, #1a0e05);
            padding: 28px;
            margin-bottom: 18px;
        }

        .card h2 {
            color: #f1c40f;
            letter-spacing: 3px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            border-bottom: 1px solid #3d1a00;
            padding-bottom: 8px;
        }

        /* Fighter bets */
        .fighters {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .fighter-option {
            flex: 1;
            min-width: 220px;
        }

        .fighter-option input[type="radio"] { display: none; }

        .fighter-label {
            display: block;
            border: 2px solid #3d1a00;
            padding: 18px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
            position: relative;
        }

        .fighter-label:hover { border-color: #8b4513; background: #2d1a0a; }

        .fighter-option input:checked + .fighter-label {
            border-color: #f1c40f;
            background: #3d2a0a;
        }

        .fighter-option input:checked + .fighter-label::after {
            content: '✓ SELECTED';
            position: absolute;
            top: 6px; right: 8px;
            font-size: 0.6rem;
            color: #f1c40f;
            letter-spacing: 1px;
        }

        .fighter-name { font-size: 1.3rem; color: #f1c40f; margin-bottom: 6px; letter-spacing: 2px; }
        .fighter-odds { font-size: 0.85rem; color: #a0845c; }
        .fighter-icon { font-size: 2.2rem; margin-bottom: 10px; }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            background: #6b4226;
            color: #f0d9a0;
            border: 2px solid #a06840;
            cursor: pointer;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.1s;
        }
        .btn:hover { background: #8b5a36; border-color: #f1c40f; }
        .btn:active { transform: scale(0.99); }

        /* Health bars */
        .health-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .fighter-label-small { width: 70px; font-size: 0.8rem; color: #a0845c; }
        .hp-track {
            flex: 1;
            height: 18px;
            background: #1a0e05;
            border: 1px solid #3d1a00;
            border-radius: 3px;
            overflow: hidden;
        }
        .hp-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .hp-fill.f1 { background: linear-gradient(to right, #2ecc71, #1abc9c); }
        .hp-fill.f2 { background: linear-gradient(to right, #e74c3c, #c0392b); }
        .hp-val { width: 36px; text-align: right; font-size: 0.8rem; color: #f0d9a0; }

        /* Fight log */
        .log-box {
            height: 180px;
            overflow-y: auto;
            background: #0d0500;
            border: 1px solid #3d1a00;
            padding: 10px 14px;
            font-size: 0.8rem;
            line-height: 1.7;
            color: #a0845c;
        }
        .log-box .hit-1 { color: #2ecc71; }
        .log-box .hit-2 { color: #e74c3c; }
        .log-box .log-begin { color: #f1c40f; }

        /* Result banner */
        .result-banner {
            text-align: center;
            padding: 18px;
            font-size: 1.2rem;
            letter-spacing: 4px;
            border: 2px solid;
            margin-top: 0;
        }
        .result-banner.win  { color: #2ecc71; border-color: #2ecc71; background: rgba(46,204,113,0.07); }
        .result-banner.lose { color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.07); }

        .back-link {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #5a3a1a;
            letter-spacing: 2px;
        }
        .back-link a { color: #a0845c; text-decoration: none; }
        .back-link a:hover { color: #f1c40f; }

        /* Scrollbar */
        .log-box::-webkit-scrollbar { width: 4px; }
        .log-box::-webkit-scrollbar-track { background: #0d0500; }
        .log-box::-webkit-scrollbar-thumb { background: #3d1a00; border-radius: 2px; }
    </style>
</head>
<body>

<div class="header">
    <h1>DEAD CODE SALOON</h1>
    <p>UNDERGROUND FIGHT RING</p>
</div>

<!-- Bet form -->
<div class="card">
    <h2>PLACE YOUR BET</h2>
    <form method="post" id="betForm">
        {% csrf_token %}
        <div class="fighters">
            <div class="fighter-option">
                <input type="radio" name="bet" value="fighter1" id="bet1" required>
                <label class="fighter-label" for="bet1">
                    <div class="fighter-icon">🥊</div>
                    <div class="fighter-name">{{ f1.name }}</div>
                    <div class="fighter-odds">Odds: {{ f1.odds }}x payout</div>
                </label>
            </div>
            <div class="fighter-option">
                <input type="radio" name="bet" value="fighter2" id="bet2" required>
                <label class="fighter-label" for="bet2">
                    <div class="fighter-icon">💀</div>
                    <div class="fighter-name">{{ f2.name }}</div>
                    <div class="fighter-odds">Odds: {{ f2.odds }}x payout</div>
                </label>
            </div>
        </div>
        <button type="submit" class="btn">PLACE BET &amp; START FIGHT</button>
    </form>
</div>

{% if result %}
<!-- Health bars -->
<div class="card">
    <h2>FIGHT IN PROGRESS</h2>
    <div class="health-row">
        <div class="fighter-label-small">{{ f1.name }}</div>
        <div class="hp-track">
            <div class="hp-fill f1" id="hp1Bar" style="width:100%"></div>
        </div>
        <div class="hp-val" id="hp1Val">100</div>
    </div>
    <div class="health-row">
        <div class="fighter-label-small">{{ f2.name }}</div>
        <div class="hp-track">
            <div class="hp-fill f2" id="hp2Bar" style="width:100%"></div>
        </div>
        <div class="hp-val" id="hp2Val">100</div>
    </div>

    <div class="log-box" id="fightLog"></div>
</div>

<!-- Result (hidden until animation done) -->
<div class="result-banner {% if betWon %}win{% else %}lose{% endif %}" id="resultBanner" style="display:none;width:660px;max-width:100%;">
    {{ result }}
</div>

<script>
// Animate the fight log line by line
const logData = [
    {% for line in log %}"{{ line|escapejs }}"{% if not forloop.last %},{% endif %}
    {% endfor %}
];

const f1Name = "{{ f1.name|escapejs }}";
const f2Name = "{{ f2.name|escapejs }}";

const logBox  = document.getElementById('fightLog');
const hp1Bar  = document.getElementById('hp1Bar');
const hp2Bar  = document.getElementById('hp2Bar');
const hp1Val  = document.getElementById('hp1Val');
const hp2Val  = document.getElementById('hp2Val');
let hp1 = 100, hp2 = 100;

function parseDmg(line) {
    const m = line.match(/for (\d+) damage/);
    return m ? parseInt(m[1]) : 0;
}

function appendLine(line) {
    const div = document.createElement('div');
    if (line.includes('begins')) {
        div.className = 'log-begin';
    } else if (line.startsWith(f1Name)) {
        div.className = 'hit-1';
        hp2 = Math.max(0, hp2 - parseDmg(line));
        hp2Bar.style.width = hp2 + '%';
        hp2Val.textContent = hp2;
    } else if (line.startsWith(f2Name)) {
        div.className = 'hit-2';
        hp1 = Math.max(0, hp1 - parseDmg(line));
        hp1Bar.style.width = hp1 + '%';
        hp1Val.textContent = hp1;
    }
    div.textContent = line;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}

function animateLog(i) {
    if (i >= logData.length) {
        setTimeout(() => {
            document.getElementById('resultBanner').style.display = 'block';
        }, 400);
        return;
    }
    appendLine(logData[i]);
    setTimeout(() => animateLog(i + 1), 280);
}

animateLog(0);
</script>
{% endif %}

<div class="back-link"><a href="/">&larr; Back to Saloon</a></div>

</body>
</html>
